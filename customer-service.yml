server:
  port: 8092

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/customer_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
    username: root
    password: akshay

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
